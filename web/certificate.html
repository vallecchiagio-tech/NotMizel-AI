<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotMizel-AI — Test ricevuta PDF (Fase 1)</title>
  <style>
    body { font-family: sans-serif; background:#0d0f14; color:#e8e8e8; padding:2rem; }
    button { padding:0.8rem 1.5rem; font-size:1rem; cursor:pointer; }
    #log { margin-top:1rem; color:#9f4df1; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>Test ricevuta PDF — Fase 1</h1>
  <p>Pagina standalone di test. NON è la PWA (Task 9).</p>
  <button id="btn-test">Genera PDF di prova</button>
  <div id="log"></div>
  <script src="./src/pdf/pdf-lib.min.js"></script>
  <script src="./src/certificate.js"></script>
  <script>
    const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
    document.getElementById('btn-test').addEventListener('click', async () => {
      try {
        log('Genero ricevuta con dati FINTI (Fase 2)...');
        const stampFinto = {
          file_hash: 'a3f9c2e81b47d605f2a91c3e8b47d605f2a91c3e8b47d605f2a91c3e8b47d605f',
          ots_proof: 'AAAAAA++++++++++AAAAAA== (proof OTS di ESEMPIO — Fase 2, dati finti)',
          status: 'confirmed',
          block_height: 912345,
          created_at: '2026-09-02T17:04:00Z',
        };
        const nome = await downloadCertificate(stampFinto);
        log('OK — scaricato: ' + nome);
      } catch (e) {
        log('ERRORE: ' + e.message);
        console.error(e);
      }
    });
    </script>
</body>
